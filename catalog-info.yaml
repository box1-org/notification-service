apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: notification-service
  description: "A Quarkus REST service on OpenShift"
  annotations:
    github.com/project-slug: box1-org/notification-service
    backstage.io/kubernetes-id: notification-service
    backstage.io/techdocs-ref: dir:.
    backstage.io/source-location: url:https://github.com/box1-org/notification-service/
    janus-idp.io/tekton: notification-service
    argocd/instance-name: openshift-gitops
    argocd/app-selector: backstage.io/kubernetes-id=notification-service
    box1.org/template-version: "1.1.0"
  tags: [java, quarkus, maven, tekton, gitops]
  links:
    - url: https://github.com/box1-org/notification-service
      title: Source Repository
      icon: github
    - url: https://notification-service-dev.apps.ocp.box1.org/q/swagger-ui/
      title: Swagger UI — test endpoints
      icon: code
    - url: https://notification-service-dev.apps.ocp.box1.org/q/openapi
      title: OpenAPI specification
      icon: code
    - url: https://notification-service-dev.apps.ocp.box1.org
      title: Application Route (after first release)
    - url: https://github.com/box1-org/box1-workloads-dev/tree/main/workloads/notification-service
      title: Desired deployment configuration
    - url: https://devspaces.apps.ocp.box1.org/#https://github.com/box1-org/notification-service
      title: Open in Dev Spaces
      icon: code
    # Add actual service-specific observability URLs
    # when dashboards and log views exist.
spec:
  type: service
  lifecycle: experimental
  owner: "user:default/mike4263"
  # Add when the corresponding System entity exists:
  # system: box1-demo
  providesApis:
    - notification-service-api
    - box1-notification-events
  consumesApis:
    - box1-order-events
    - box1-fulfillment-events
  dependsOn:
    - resource:notification-service-postgres
    - resource:box1-kafka
    - resource:mailhog
    - resource:keycloak-box1
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: notification-service-api
  description: OpenAPI contract for notification-service
  tags: [quarkus, openapi]
spec:
  type: openapi
  lifecycle: experimental
  owner: "user:default/mike4263"
  definition:
    $text: https://notification-service-dev.apps.ocp.box1.org/q/openapi
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: box1-notification-events
  title: box1.notification.events.v1
  description: Kafka topic box1.notification.events.v1, produced by notification-service through its transactional outbox. Contracts are owned by box1-ops-contracts.
  tags: [kafka, events, asyncapi]
  links:
    - url: https://github.com/box1-org/box1-ops-contracts/blob/main/TOPICS.md
      title: Topic ownership and consumer groups
      icon: docs
spec:
  type: asyncapi
  lifecycle: experimental
  owner: "user:default/mike4263"
  definition: |
    asyncapi: 2.6.0
    info:
      title: box1.notification.events.v1
      version: v1
      description: >-
        Delivery is at least once; consumers record eventId transactionally.
        Partition key orderId. Retention 14d.
    servers:
      dev:
        url: box1-kafka-kafka-bootstrap.box1-kafka.svc:9092
        protocol: kafka
    channels:
      box1.notification.events.v1:
        publish:
          summary: Events published by notification-service
          message:
            oneOf:
            - name: notification.requested.v1
              title: notification.requested.v1
              summary: v1 envelope carrying notification.requested (schema pending in box1-ops-contracts)
              contentType: application/json
            - name: notification.delivered.v1
              title: notification.delivered.v1
              summary: v1 envelope carrying notification.delivered (see https://github.com/box1-org/box1-ops-contracts/blob/main/events/v1/notification.delivered.schema.json)
              contentType: application/json
            - name: notification.failed.v1
              title: notification.failed.v1
              summary: v1 envelope carrying notification.failed (see https://github.com/box1-org/box1-ops-contracts/blob/main/events/v1/notification.failed.schema.json)
              contentType: application/json
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: notification-service-postgres
  description: PostgreSQL database notification_service owned by notification-service (notification-service-dev namespace)
  tags: [postgresql, database]
  links:
    - url: https://github.com/box1-org/box1-workloads-dev/blob/main/workloads/notification-service/postgres.yaml
      title: Database manifest
spec:
  type: database
  lifecycle: experimental
  owner: "user:default/mike4263"

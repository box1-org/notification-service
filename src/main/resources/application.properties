quarkus.application.name=notification-service
quarkus.http.host=0.0.0.0
greeting.prefix=${GREETING_PREFIX:Hello}
quarkus.smallrye-openapi.info-title=notification-service REST API
quarkus.smallrye-openapi.info-version=1.0.0
# Jib pushes directly to the registry. Build/push are opt-in at build time.
quarkus.container-image.builder=jib
quarkus.jib.base-jvm-image=registry.access.redhat.com/ubi9/openjdk-21-runtime@sha256:cfa544effa28c5c57197a4c9d460812e70efc0965e6f518e1c2e787ff3cb9335
quarkus.jib.platforms=linux/amd64
quarkus.jib.use-current-timestamp=false

# The catalog reads the deployed contract; Swagger uses the public HTTPS Route.
%prod.quarkus.smallrye-openapi.servers=${PUBLIC_API_URL:https://notification-service-dev.apps.ocp.box1.org}
quarkus.swagger-ui.always-include=true
# Allow Developer Hub's API Definition tester to call this service directly.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=https://developer-hub.apps.ocp.box1.org
quarkus.http.cors.methods=GET,HEAD,OPTIONS,POST,DELETE
quarkus.http.cors.headers=Accept,Authorization,Content-Type,traceparent
quarkus.http.cors.access-control-allow-credentials=false




# Request bodies are small fault-control documents.
quarkus.http.limits.max-body-size=4K
quarkus.jackson.fail-on-unknown-properties=true

# PostgreSQL. The JDBC URL, username and password come from the environment at runtime (decision D-008).
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
# 25 tries 5 s apart (about 2 minutes) fit the 150 s startup probe.
quarkus.flyway.connect-retries=25
quarkus.flyway.connect-retries-interval=5
quarkus.datasource.jdbc.max-size=10
# Short waits, so a readiness check answers within its probe timeout.
quarkus.datasource.jdbc.acquisition-timeout=PT1.5S
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=2
# Keeps row values out of driver messages.
quarkus.datasource.jdbc.additional-jdbc-properties.logServerErrorDetail=false
quarkus.datasource.health.enabled=false
notification.readiness.database=true

# Kafka. The bootstrap address comes from KAFKA_BOOTSTRAP_SERVERS at runtime (decision D-006).
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
quarkus.kafka.devservices.enabled=false
mp.messaging.incoming.order-events.connector=smallrye-kafka
mp.messaging.incoming.order-events.topic=box1.order.events.v1
mp.messaging.incoming.fulfillment-events.connector=smallrye-kafka
mp.messaging.incoming.fulfillment-events.topic=box1.fulfillment.events.v1
mp.messaging.incoming.order-events.group.id=notification
mp.messaging.incoming.fulfillment-events.group.id=notification
# Earliest plus the required floor below: lost offsets are harmless and history before the floor never becomes notices.
mp.messaging.incoming.order-events.auto.offset.reset=earliest
mp.messaging.incoming.fulfillment-events.auto.offset.reset=earliest
mp.messaging.incoming.order-events.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
mp.messaging.incoming.fulfillment-events.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
# Keys stay bytes too, so a dead-lettered record is byte-for-byte what arrived.
mp.messaging.incoming.order-events.key.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
mp.messaging.incoming.fulfillment-events.key.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
mp.messaging.incoming.order-events.failure-strategy=dead-letter-queue
mp.messaging.incoming.fulfillment-events.failure-strategy=dead-letter-queue
mp.messaging.incoming.order-events.dead-letter-queue.topic=${notification.dlq.topic}
mp.messaging.incoming.fulfillment-events.dead-letter-queue.topic=${notification.dlq.topic}
mp.messaging.incoming.order-events.dead-letter-queue.key.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
mp.messaging.incoming.fulfillment-events.dead-letter-queue.key.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
mp.messaging.incoming.order-events.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
mp.messaging.incoming.fulfillment-events.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
# A database outage holds records in retries, which must not trip the 60 s default and restart the pod.
mp.messaging.incoming.order-events.throttled.unprocessed-record-max-age.ms=-1
mp.messaging.incoming.fulfillment-events.throttled.unprocessed-record-max-age.ms=-1
mp.messaging.incoming.order-events.health-readiness-enabled=false
mp.messaging.incoming.fulfillment-events.health-readiness-enabled=false
mp.messaging.incoming.order-events.tracing-enabled=false
mp.messaging.incoming.fulfillment-events.tracing-enabled=false

# Dead-letter replay (docs/runbook.md). Off unless an operator enables it in the Deployment; its own consumer group, so
# replay never produces to topics other services consume. Records that are still poison are logged and skipped.
mp.messaging.incoming.dlq-replay.connector=smallrye-kafka
mp.messaging.incoming.dlq-replay.enabled=${NOTIFY_DLQ_REPLAY_ENABLED:false}
mp.messaging.incoming.dlq-replay.topic=${notification.dlq.topic}
mp.messaging.incoming.dlq-replay.group.id=notification-replay
mp.messaging.incoming.dlq-replay.auto.offset.reset=earliest
mp.messaging.incoming.dlq-replay.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
mp.messaging.incoming.dlq-replay.key.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
mp.messaging.incoming.dlq-replay.failure-strategy=ignore
mp.messaging.incoming.dlq-replay.throttled.unprocessed-record-max-age.ms=-1
mp.messaging.incoming.dlq-replay.health-readiness-enabled=false
mp.messaging.incoming.dlq-replay.tracing-enabled=false

# Consumer
# Required, no default: an event that occurred before this instant gets no notice (decision D-006, docs/runbook.md).
notification.consumer.events-floor=${NOTIFY_EVENTS_FLOOR}
notification.consumer.max-attempts=${NOTIFY_CONSUMER_MAX_ATTEMPTS:20}
notification.consumer.initial-backoff-millis=${NOTIFY_CONSUMER_INITIAL_BACKOFF_MILLIS:500}
notification.consumer.max-backoff-millis=${NOTIFY_CONSUMER_MAX_BACKOFF_MILLIS:30000}
notification.dlq.topic=box1.notification.dlq.v1
notification.startup.check-dlq-topic=${NOTIFY_CHECK_DLQ_TOPIC:true}

# Operator channels per notice type (decision D-002).
notification.channel.order-shipped=${NOTIFY_CHANNEL_ORDER_SHIPPED:ops-fulfillment}
notification.channel.shipment-delayed=${NOTIFY_CHANNEL_SHIPMENT_DELAYED:ops-fulfillment}
notification.channel.shipment-failed=${NOTIFY_CHANNEL_SHIPMENT_FAILED:ops-fulfillment}
notification.channel.order-exception=${NOTIFY_CHANNEL_ORDER_EXCEPTION:ops-orders}
notification.channel.order-rejected=${NOTIFY_CHANNEL_ORDER_REJECTED:ops-orders}

# Delivery (decision D-004). Hard caps are compiled in; these can only lower them.
# mailhog: real SMTP to the in-cluster MailHog sink (the cluster setting). stub: receipts only, for tests.
# The default stays stub, so an image never needs SMTP settings it was not deployed with.
notification.provider=${NOTIFY_PROVIDER:stub}
# MailHog SMTP. Each channel maps to <channel>@<recipient-domain>, e.g. ops-fulfillment@box1.local. No auth, no TLS:
# MailHog is cluster-internal and its NetworkPolicy admits SMTP only from this namespace.
notification.smtp.host=${NOTIFY_SMTP_HOST:mailhog.mailhog.svc.cluster.local}
notification.smtp.port=${NOTIFY_SMTP_PORT:1025}
notification.smtp.from=${NOTIFY_SMTP_FROM:box1-notifications@box1.local}
notification.smtp.recipient-domain=${NOTIFY_SMTP_RECIPIENT_DOMAIN:box1.local}
# Connect, read and write timeout each; below the provider timeout, so a hung server is reported by this call itself.
notification.smtp.timeout-millis=${NOTIFY_SMTP_TIMEOUT_MILLIS:1500}
notification.delivery.max-attempts=${NOTIFY_DELIVERY_MAX_ATTEMPTS:6}
notification.delivery.base-backoff-seconds=${NOTIFY_DELIVERY_BASE_BACKOFF_SECONDS:2}
notification.delivery.max-backoff-seconds=${NOTIFY_DELIVERY_MAX_BACKOFF_SECONDS:60}
notification.delivery.provider-timeout-millis=${NOTIFY_PROVIDER_TIMEOUT_MILLIS:2000}
notification.delivery.lease-seconds=${NOTIFY_DELIVERY_LEASE_SECONDS:30}
notification.delivery.batch-size=${NOTIFY_DELIVERY_BATCH_SIZE:10}
notification.delivery.poll-interval=${NOTIFY_DELIVERY_POLL_INTERVAL:1s}

# Outbox to box1.notification.events.v1 (decision D-005).
notification.outbox.topic=box1.notification.events.v1
notification.outbox.poll-interval=${NOTIFY_OUTBOX_POLL_INTERVAL:1s}
notification.outbox.batch-size=${NOTIFY_OUTBOX_BATCH_SIZE:100}
notification.outbox.lease-seconds=${NOTIFY_OUTBOX_LEASE_SECONDS:60}
notification.outbox.backoff-base-seconds=${NOTIFY_OUTBOX_BACKOFF_BASE_SECONDS:1}
notification.outbox.backoff-max-seconds=${NOTIFY_OUTBOX_BACKOFF_MAX_SECONDS:300}
notification.metrics.refresh-interval=${NOTIFY_METRICS_REFRESH_INTERVAL:15s}

# Delivery fault control (decision D-009), applied at the provider boundary for either provider. Off, with an empty
# allowlist, until the user names a demo namespace. The notification.stub.* names are kept from v1 for compatibility.
notification.stub.faults-enabled=${NOTIFY_STUB_FAULTS_ENABLED:false}
notification.stub.fault-namespaces=${NOTIFY_STUB_FAULT_NAMESPACES:}
notification.stub.max-ttl-seconds=${NOTIFY_STUB_MAX_TTL_SECONDS:900}
notification.stub.sweep-interval=${NOTIFY_STUB_SWEEP_INTERVAL:5s}
# From the downward API, never from configuration the service controls.
notification.pod-namespace=${POD_NAMESPACE:}

# Retention (decision D-010).
# At least 15: a terminal notice must outlive the 14-day topic retention, or a late report of its fact makes a new one.
notification.retention.terminal-days=${NOTIFY_RETENTION_TERMINAL_DAYS:30}
notification.retention.processed-event-days=${NOTIFY_RETENTION_PROCESSED_EVENT_DAYS:30}
notification.retention.published-outbox-days=${NOTIFY_RETENTION_PUBLISHED_OUTBOX_DAYS:7}
notification.retention.cron=${NOTIFY_RETENTION_CRON:0 17 3 * * ?}

# Access (decision D-007). Smoke paths are anonymous for the release smoke task (box1-docs#40); everything else is
# deny-by-default, and /api/v1 needs a token whose client and roles ClientRoleAugmentor accepts.
quarkus.http.auth.proactive=false
quarkus.smallrye-jwt.blocking-authentication=true
mp.jwt.verify.issuer=${NOTIFY_JWT_ISSUER:https://keycloak.apps.ocp.box1.org/auth/realms/box1}
mp.jwt.verify.publickey.location=${NOTIFY_JWKS_URL:https://keycloak.apps.ocp.box1.org/auth/realms/box1/protocol/openid-connect/certs}
mp.jwt.verify.audiences=${NOTIFY_JWT_AUDIENCES:notification-service}
mp.jwt.verify.clock.skew=30
notification.auth.console-client-id=${NOTIFY_AUTH_CONSOLE_CLIENT_ID:}
notification.auth.console-reader-roles=${NOTIFY_AUTH_CONSOLE_READER_ROLES:console-viewer,console-operator}
quarkus.http.auth.permission.smoke.paths=/api/greetings,/api/info,/q/*
quarkus.http.auth.permission.smoke.policy=permit
# /api/v1 is authorized by @RolesAllowed on every endpoint, so refusals are Problem JSON; unannotated endpoints are denied.
quarkus.http.auth.permission.api.paths=/api/v1/*
quarkus.http.auth.permission.api.policy=permit
quarkus.security.jaxrs.deny-unannotated-endpoints=true
quarkus.http.auth.permission.everything-else.paths=/*
quarkus.http.auth.permission.everything-else.policy=deny
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=bearer

# Traces propagate through the event envelope and W3C headers. Export stays off until a collector exists (box1-docs#22).
# Trace export (box1-docs#22). The exporter and sampler are fixed at build
# time, so the OTLP exporter is built in and export is switched at run time:
# sampling ratio 0.0 exports nothing. The deployment turns it on with
# QUARKUS_OTEL_TRACES_SAMPLER_ARG=1.0 and QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
# Unsampled spans still carry valid trace IDs, so traceparent propagation and
# correlation are unchanged. Dev and test keep the previous behaviour.
quarkus.otel.traces.exporter=cdi
quarkus.otel.traces.sampler=traceidratio
quarkus.otel.traces.sampler.arg=0.0
%dev.quarkus.otel.traces.exporter=none
%dev.quarkus.otel.traces.sampler=parentbased_always_on
%test.quarkus.otel.traces.exporter=none
%test.quarkus.otel.traces.sampler=parentbased_always_on
quarkus.otel.metrics.exporter=none
quarkus.otel.logs.exporter=none

# Structured JSON logs in the deployed image; MDC carries orderId, notificationId, eventId and correlationId.
quarkus.log.console.json.additional-field."service".value=notification-service
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

# The default test run has no database or broker, because the CI task has no container runtime.
# Tests tagged "containers" supply both; run them with -Pcontainers.
quarkus.test.integration-test-profile=test
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.jdbc.url=${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/service}
%test.quarkus.datasource.username=${TEST_DATABASE_USERNAME:postgres}
%test.quarkus.datasource.password=${TEST_DATABASE_PASSWORD:postgres}
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.scheduler.enabled=false
%test.notification.readiness.database=false
%test.notification.consumer.events-floor=2000-01-01T00:00:00Z
%test.mp.messaging.incoming.order-events.enabled=false
%test.mp.messaging.incoming.fulfillment-events.enabled=false
%test.mp.messaging.incoming.dlq-replay.enabled=false
%test.notification.startup.check-dlq-topic=false
